project_name: irtt
version: 2
builds:
  - main: ./cmd/irtt
    id: "irtt"
    binary: irtt
    env: [CGO_ENABLED=0]
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - 386
    goarm:
      - 7

# https://goreleaser.com/customization/nfpm/
nfpms:
  - maintainer: clarkzjw <i@jinwei.me>
    description: Modified IRTT redacting host information
    homepage: https://github.com/clarkzjw/irtt
    license: MIT
    package_name: starlink-irtt
    replaces:
    - irtt
    formats:
    - deb
    priority: extra
